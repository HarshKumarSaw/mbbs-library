name: Daily Morning Timetable Push (8:00 AM IST)

on:
  schedule:
    # Run well ahead of 08:00 AM IST (02:30 UTC) at off-peak minutes so OneSignal
    # queues the notification for exact 08:00:00 IST regardless of GitHub cron lag.
    - cron: '17 19 * * *' # 00:47 AM IST
    - cron: '47 22 * * *' # 04:17 AM IST
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

concurrency:
  group: daily-timetable-notification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-morning-notification:
    name: Queue 8:00 AM IST Morning Schedule Alert
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Google Calendar Feed
        env:
          COLLEGE_ICAL_URL: ${{ secrets.COLLEGE_ICAL_URL }}
        run: |
          python3 scripts/sync_timetable.py || true

      - name: Queue Exact 8:00 AM IST Morning Schedule Notification
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          python3 scripts/notify_daily_schedule.py --mode upcoming
