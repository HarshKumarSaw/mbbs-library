name: Daily Evening Timetable Push (5:00 PM IST)

on:
  schedule:
    # Run well ahead of 05:00 PM IST (11:30 UTC) at off-peak minutes so OneSignal
    # queues the notification for exact 17:00:00 IST regardless of GitHub cron lag.
    - cron: '17 4 * * *' # 09:47 AM IST
    - cron: '47 7 * * *' # 01:17 PM IST
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

concurrency:
  group: evening-timetable-notification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-evening-notification:
    name: Queue 5:00 PM IST Evening Schedule Alert
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Google Calendar Feed
        env:
          COLLEGE_ICAL_URL: ${{ secrets.COLLEGE_ICAL_URL }}
        run: |
          python3 scripts/sync_timetable.py || true

      - name: Queue Exact 5:00 PM IST Evening Schedule Notification
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          python3 scripts/notify_daily_schedule.py --mode upcoming
